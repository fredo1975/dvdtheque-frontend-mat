<div class="add-container">
    <div class="search-header mat-elevation-z2">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Rechercher un film sur TMDB</mat-label>
            <input matInput [(ngModel)]="titre" (keyup.enter)="serachTmdbFilm()" placeholder="Ex: Inception">
            <button mat-icon-button matSuffix (click)="resetTmdbFilm()" *ngIf="titre">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="origine-field">
            <mat-label>Destination (Origine)</mat-label>
            <mat-select [(ngModel)]="origine">
                <mat-option *ngFor="let o of origines" [value]="o">{{o}}</mat-option>
            </mat-select>
        </mat-form-field>

        <div class="actions">
            <button mat-raised-button color="primary" (click)="serachTmdbFilm()" [disabled]="buttonDisabled || !titre">
                <mat-icon>search</mat-icon> RECHERCHER
            </button>
        </div>
    </div>

    <div class="status-zone" *ngIf="loading || errorOccured">
        <mat-spinner *ngIf="loading" diameter="50"></mat-spinner>
        <div class="error-msg" *ngIf="errorOccured">
            <mat-icon>error</mat-icon> Une erreur est survenue lors de la communication avec TMDB.
        </div>
    </div>

    <div class="results-grid" *ngIf="tmdbFilms.length > 0">
        <div class="tmdb-card" *ngFor="let film of tmdbFilms">
            <div class="poster-wrapper">
                <img [src]="film.posterPath" [alt]="film.titre" class="tmdb-poster">
                <div class="already-in" *ngIf="film.alreadyInDvdtheque">
                    <mat-icon>check_circle</mat-icon> DÉJÀ EN COLLECTION
                </div>
            </div>
            
            <div class="tmdb-info">
                <h3 class="tmdb-title">{{film.titre}}</h3>
                <p class="tmdb-subtitle">{{film.annee}} • {{film.realisateur | realisateurs}}</p>
                <p class="tmdb-cast">{{film.acteur | acteurs}}</p>
            </div>

            <div class="tmdb-actions">
                <button mat-flat-button color="accent" 
                        *ngIf="!film.alreadyInDvdtheque" 
                        (click)="saveFilm(film.id)"
                        [disabled]="buttonDisabled || !origine">
                    <mat-icon>add</mat-icon> AJOUTER
                </button>
            </div>
        </div>
    </div>
</div>
