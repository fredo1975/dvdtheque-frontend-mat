<app-film-filter-sort (filterChange)="filterOnFilmFilterSort($event)">

<table mat-table [dataSource]="store.films()">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let film">{{film.id}}</td>
  </ng-container>

  <ng-container matColumnDef="titre">
    <th mat-header-cell *matHeaderCellDef>Titre</th>
    <td mat-cell *matCellDef="let film">{{film.titre}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator
  [length]="store.totalElements()"
  [pageSize]="store.pageSize()"
  (page)="handlePageEvent($event)">
</mat-paginator>
